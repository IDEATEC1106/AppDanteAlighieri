# Configuración del paquete para Flet
app:
  name: "App Dante Alighieri"
  description: "Colegio Dante Alighieri"
  
  android:
    package_name: "com.ideatec.dantealighieri"
    permissions:
      - INTERNET
      - RECEIVE_BOOT_COMPLETED
      - VIBRATE
      - WAKE_LOCK
      - POST_NOTIFICATIONS

  assets:
    - database.py
    - google-services.json
